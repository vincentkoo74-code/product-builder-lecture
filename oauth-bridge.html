<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 확인 중</title>
  <style>
    body {
      align-items: center;
      background: #fff7ea;
      color: #24170f;
      display: flex;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      text-align: center;
    }
    main {
      background: #fff;
      border: 1px solid #f3d8ad;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(120, 74, 27, 0.14);
      max-width: 360px;
      padding: 28px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #7a6657; line-height: 1.5; margin: 0 0 18px; }
    a {
      background: #f79335;
      border-radius: 14px;
      color: #fff;
      display: inline-block;
      font-weight: 800;
      padding: 12px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>로그인 확인 중...</h1>
    <p>앱으로 돌아가 로그인을 완료합니다.</p>
    <a id="fallbackLink" href="#">앱으로 돌아가기</a>
  </main>
  <script>
    (function () {
      var search = new URLSearchParams(location.search);
      var hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      var provider = search.get("provider") || hash.get("provider") || "";

      var target = new URL("com.maru.rps://oauth");
      // 쿼리와 해시 파라미터를 모두 앱 스킴으로 전달한다.
      // (PKCE는 ?code=..., implicit/일부 provider는 #access_token=...&refresh_token=... 로 올 수 있음)
      search.forEach(function (v, k) { target.searchParams.set(k, v); });
      hash.forEach(function (v, k) { if (!target.searchParams.has(k)) target.searchParams.set(k, v); });
      if (provider && !target.searchParams.get("provider")) target.searchParams.set("provider", provider);

      var url = target.toString();
      var link = document.getElementById("fallbackLink");
      if (link) link.href = url;

      function go() {
        try { location.replace(url); } catch (e) { location.href = url; }
      }
      // 즉시 시도 + 짧은 재시도. SFSafariViewController가 첫 자동 리다이렉트를 무시하는 경우 대비.
      go();
      setTimeout(go, 250);
      setTimeout(go, 1000);
    })();
  </script>
</body>
</html>
