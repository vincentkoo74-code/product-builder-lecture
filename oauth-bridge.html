<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 확인 중</title>
  <style>
    body {
      align-items: center;
      background: #fff7ea;
      color: #24170f;
      display: flex;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      text-align: center;
    }
    main {
      background: #fff;
      border: 1px solid #f3d8ad;
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(120, 74, 27, 0.14);
      max-width: 360px;
      padding: 28px;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #7a6657; line-height: 1.5; margin: 0 0 18px; }
    a {
      background: #f79335;
      border-radius: 14px;
      color: #fff;
      display: inline-block;
      font-weight: 800;
      padding: 12px 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>로그인 확인 중...</h1>
    <p>앱으로 돌아가 로그인을 완료합니다.</p>
    <a id="fallbackLink" href="#">앱으로 돌아가기</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const provider = params.get("provider") || "";
    const target = new URL("com.maru.rps://oauth");
    for (const [key, value] of params.entries()) target.searchParams.set(key, value);
    if (!target.searchParams.get("provider") && provider) target.searchParams.set("provider", provider);

    const url = target.toString();
    const link = document.getElementById("fallbackLink");
    link.href = url;

    setTimeout(() => {
      location.href = url;
    }, 150);
  </script>
</body>
</html>
