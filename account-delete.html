<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마루의 가위바위보 계정 삭제 안내</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.7;margin:0;background:#fff7ed;color:#1f2937}
    main{max-width:760px;margin:0 auto;padding:40px 20px}
    h1,h2{color:#111827} a{color:#ea580c}
    section{background:#fff;border:1px solid #fed7aa;border-radius:16px;padding:20px;margin:16px 0}
  </style>
</head>
<body>
<main>
  <h1>계정 삭제 안내</h1>
  <p>시행일: 2026년 5월 29일</p>
  <section>
    <h2>앱에서 삭제하기</h2>
    <p>앱에서 로그인한 뒤 <strong>내 기록</strong> 화면을 열고 <strong>계정 삭제</strong>를 선택하면 계정과 계정에 연결된 게임 기록이 삭제됩니다.</p>
  </section>
  <section>
    <h2>삭제되는 데이터</h2>
    <p>SNS 로그인 계정, 계정 승률, 계정 게임 기록이 삭제됩니다. 게스트 모드로 기기에만 저장된 임시 데이터는 앱 삭제 또는 브라우저 저장공간 삭제로 제거할 수 있습니다.</p>
  </section>
  <section>
    <h2>주의</h2>
    <p>계정 삭제 후에는 저장된 승률과 게임 기록을 복구할 수 없습니다.</p>
  </section>
  <p><a href="/">앱으로 돌아가기</a></p>
</main>
</body>
</html>
