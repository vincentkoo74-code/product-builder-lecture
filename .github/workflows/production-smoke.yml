name: Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production app and Supabase endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTML contains current app hooks
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsSL --max-time 20 --retry 3 --retry-delay 5 \
              https://product-builder-lecture-phi.vercel.app/ > /tmp/production.html
            if grep -q "loginWithSns" /tmp/production.html \
              && grep -q "line-auth" /tmp/production.html \
              && grep -q "kakao-auth" /tmp/production.html \
              && grep -q "home.quickMyStats" /tmp/production.html; then
              echo "Production app contains current hooks."
              exit 0
            fi
            echo "Production is not updated yet. Retry $attempt/20..."
            sleep 30
          done
          echo "Production app did not update within 10 minutes."
          exit 1

      - name: Verify Supabase Edge Functions are reachable
        run: |
          set -euo pipefail
          for fn in kakao-auth line-auth delete-account; do
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 20 -X OPTIONS "https://cmfxhehpreanijwanwrr.supabase.co/functions/v1/$fn" >/dev/null; then
                echo "$fn is reachable."
                break
              fi
              if [ "$attempt" = "20" ]; then
                echo "$fn did not become reachable."
                exit 1
              fi
              echo "$fn is not reachable yet. Retry $attempt/20..."
              sleep 15
            done
          done

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_TEXT="성공"
          else
            STATUS_TEXT="실패"
          fi
          MESSAGE="$(printf '윈도우-덱스: Android 앱 업데이트 검증 %s\n커밋: %s\n%s' "$STATUS_TEXT" "${COMMIT_SHA:0:7}" "$RUN_URL")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
