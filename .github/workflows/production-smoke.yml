# Production Smoke Test — V1.0_JP 리전 인식 개정
#
# 읽기 전용(curl GET/OPTIONS)이므로 백엔드를 변경하지 않는다.
# 개정 사유: Supabase project ref 가 Tokyo 로 하드코딩되어 있어 KR/JP 이원 운영에서
# 항상 일본 백엔드만 검증했다. 이제 config/regions.json + config/active-region.json
# 에서 대상 리전을 도출하고, 검증할 Edge Function 목록도 리전 프로필을 따른다.

name: Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production app and Supabase endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve region from branch declaration
        id: region
        run: |
          set -euo pipefail
          REGION="$(jq -er '.region' config/active-region.json)"
          REF="$(jq -er --arg r "$REGION" '.regions[$r].supabase_project_ref' config/regions.json)"
          FNS="$(jq -er --arg r "$REGION" '.regions[$r].edge_functions_deployed | join(" ")' config/regions.json)"
          echo "region=$REGION"    >> "$GITHUB_OUTPUT"
          echo "project_ref=$REF"  >> "$GITHUB_OUTPUT"
          echo "functions=$FNS"    >> "$GITHUB_OUTPUT"
          echo "smoke 대상: $REGION / ref=$REF / functions=$FNS"

      - name: Verify production HTML contains current app hooks
        env:
          PROJECT_REF: ${{ steps.region.outputs.project_ref }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl -fsSL --max-time 20 --retry 3 --retry-delay 5 \
              https://product-builder-lecture-phi.vercel.app/ > /tmp/production.html
            if grep -q "loginWithSns" /tmp/production.html \
              && grep -q "home.quickMyStats" /tmp/production.html \
              && grep -q "$PROJECT_REF" /tmp/production.html; then
              echo "Production app contains current hooks."
              exit 0
            fi
            echo "Production is not updated yet. Retry $attempt/20..."
            sleep 30
          done
          echo "Production app did not update within 10 minutes."
          exit 1

      - name: Verify Supabase Edge Functions are reachable
        env:
          PROJECT_REF: ${{ steps.region.outputs.project_ref }}
          FUNCTIONS: ${{ steps.region.outputs.functions }}
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 20 -X OPTIONS "https://${PROJECT_REF}.supabase.co/functions/v1/$fn" >/dev/null; then
                echo "$fn is reachable."
                break
              fi
              if [ "$attempt" = "20" ]; then
                echo "$fn did not become reachable."
                exit 1
              fi
              echo "$fn is not reachable yet. Retry $attempt/20..."
              sleep 15
            done
          done

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_TEXT="성공"
          else
            STATUS_TEXT="실패"
          fi
          MESSAGE="$(printf '윈도우-덱스: Android 앱 업데이트 검증 %s\n커밋: %s\n%s' "$STATUS_TEXT" "${COMMIT_SHA:0:7}" "$RUN_URL")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
