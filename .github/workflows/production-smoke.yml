name: Production Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production app and Supabase endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTML contains current app hooks
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            html="$(curl -fsSL --retry 3 --retry-delay 5 https://product-builder-lecture-phi.vercel.app/)"
            if echo "$html" | grep -q "loginWithSns" \
              && echo "$html" | grep -q "line-auth" \
              && echo "$html" | grep -q "kakao-auth" \
              && echo "$html" | grep -q "accountStatsTopBtn"; then
              echo "Production app contains current hooks."
              exit 0
            fi
            echo "Production is not updated yet. Retry $attempt/20..."
            sleep 30
          done
          echo "Production app did not update within 10 minutes."
          exit 1

      - name: Verify Supabase Edge Functions are reachable
        run: |
          set -euo pipefail
          curl -fsS -X OPTIONS https://cmfxhehpreanijwanwrr.supabase.co/functions/v1/kakao-auth >/dev/null
          curl -fsS -X OPTIONS https://cmfxhehpreanijwanwrr.supabase.co/functions/v1/line-auth >/dev/null
